[project]
name = "calorvia-rag"
version = "1.0.0"
description = "RAG documentaire sur le corpus Calorvia : ingestion (Docling, openpyxl, VLM), recherche hybride Qdrant, reranking, génération et évaluation"
readme = "README.md"
authors = [
    { name = "Nicolas", email = "blanchard.nicolas@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3.4",
    "docling>=2.150.1",
    "ipykernel>=7.4.0",
    "numpy>=2.5.5",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "py3langid>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "ranx>=0.3.21",
    "requests>=2.34.2",
    "transformers>=5.17.0",
]

[project.scripts]
calorvia-ask = "calorvia_rag.rag.ask:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
