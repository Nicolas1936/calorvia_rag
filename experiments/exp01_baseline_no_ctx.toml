name = 'exp01_baseline_no_ctx'
tag = 'v0.2-baseline'

[corpus]
include_formats = ['docx', 'pdf', 'html', 'pptx', 'md', 'csv', 'xlsx']
include_scanned_pdfs = false
include_images = false

[chunking]
type = 'hybrid'
max_tokens = 512
overlap = 0
context_line = false          # Équivalent de patient_line = false

[embedder]
model = 'bge-m3'
vector_size = 1024
embedding_batch_size = 2048
query_instruction = ''

[index]
sparse_vector = 'bm25'
sparse_embedder_ascii_folding = true

[search]
method = 'hybrid'
candidates = 30

[reranker]
model = 'bge-reranker-v2-m3'
top_k = 5

[generation]
model = 'qwen3.8-27b'
system_prompt = 'prompts/detailed.txt'
temperature = 0.0
top_p = 1.0
top_k = 40
max_tokens = 4096
reasoning = false

[judge]
model = 'gemma-4-26b'
samples_per_type = 2
seed = 42
