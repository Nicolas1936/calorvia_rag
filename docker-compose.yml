services:
  # Base de données PostgreSQL — identifiants lus depuis le fichier .env
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calorvia_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d calorvia_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base vectorielle Qdrant — clé API lue depuis le fichier .env
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # API REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # API gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage

  # Embeddings BGE-M3 (vLLM) — démarre en premier pour réserver sa part de VRAM
  vllm-embedder:
    image: vllm/vllm-openai:latest
    container_name: vllm-embedder
    ports:
      - "8001:8001"
    volumes:
      - /home/nicolas/models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["vllm", "serve"]
    command: >
      /models/rag/embedder/bge-m3
      --served-model-name bge-m3
      --gpu-memory-utilization 0.1
      --max-model-len 8192
      --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  # Reranker BGE-Reranker-v2-M3 (vLLM) — démarre juste après l'embedder
  vllm-reranker:
    image: vllm/vllm-openai:latest
    container_name: vllm-reranker
    ports:
      - "8002:8002"
    volumes:
      - /home/nicolas/models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # depends_on:
    #   vllm-embedder:
    #     condition: service_healthy
    entrypoint: ["vllm", "serve"]
    command: >
      /models/rag/reranker/bge-reranker-v2-m3
      --served-model-name bge-reranker-v2-m3
      --gpu-memory-utilization 0.1
      --max-model-len 4096
      --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  # Proxy llama-swap — point d'entrée unique sur le port 8000 après l'initialisation vLLM
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: llama-swap
    user: root
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility] # Donne uniquement accès à nvidia-smi sans réserver de calcul
    # depends_on:
    #   vllm-reranker:
    #     condition: service_healthy
    command: ["--config", "/app/config.yaml", "--listen", "0.0.0.0:8000"]
    healthcheck:
      disable: true

  # LLM 1 : Qwen 3.8 27B (piloté à la demande par llama-swap)
  llama-qwen38:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-qwen38
    profiles: ["on-demand"]
    volumes:
      - /home/nicolas/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/qwen3.8-27b/llama/Qwen3.8-27B-UD-Q4_K_XL.gguf
      -ngl 99 -fa on
      --parallel 1 --ctx-size 8192
      -ctk q4_0 -ctv q4_0
      --spec-type draft-mtp --spec-draft-n-max 4
      --host 0.0.0.0 --port 8080

  # LLM 2 : Gemma 4 26B (piloté à la demande par llama-swap)
  llama-gemma4:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-gemma4
    profiles: ["on-demand"]
    volumes:
      - /home/nicolas/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/gemma4-26b-a4b/llama/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      -ngl 50 -fa on
      --parallel 1 --ctx-size 8196
      -ctk q8_0 -ctv q8_0
      --model-draft /models/gemma4-26b-a4b/llama/mtp-gemma-4-26B-A4B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --host 0.0.0.0 --port 8080

  # LLM 3 : Qwen multimodal 64k (piloté à la demande par llama-swap)
  llama-vision:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-vision
    profiles: ["on-demand"]
    volumes:
      - /home/nicolas/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/qwen3.8-27b/llama/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --mmproj /models/qwen3.8-27b/llama/mmproj-F16.gguf
      -np 1 -fa on
      -c 65536
      -ctk q8_0 -ctv q8_0
      --host 0.0.0.0 --port 8080

volumes:
  pgdata:
  qdrant_data:
